<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore {{ city }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-globes"></div>
    <div class="container wide">
        <header style="margin-bottom: 4rem; text-align: center; border: none; padding-top: 3rem;">
            <h1
                style="font-size: 3.5rem; font-family: 'Playfair Display', serif; color: var(--text-main); margin-bottom: 1.5rem;">
                Exploring All of {{ city }}</h1>
            <div style="display: flex; justify-content: center;">
                <a href="javascript:history.back()" class="btn-secondary"
                    style="border-radius: 50px; padding: 0.75rem 2.5rem; background: white; box-shadow: 0 4px 15px rgba(0,0,0,0.05); color: var(--text-main); font-size: 0.95rem; font-weight: 600; text-decoration: none;">Back
                    to Planner</a>
            </div>
        </header>

        <div class="results-grid"
            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2.5rem;">
            {% for p in places %}
            <div class="premium-card"
                style="padding: 2.5rem; border-radius: 16px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.04); text-align: left; transition: transform 0.3s ease; border: 1px solid #f1f5f9;">
                <div style="margin-bottom: 1.5rem;">
                    <h2
                        style="margin: 0 0 0.5rem 0; font-size: 1.6rem; font-family: 'Outfit', sans-serif; font-weight: 700; color: var(--text-main);">
                        {{ p['place'] }}</h2>
                    <span
                        style="display: inline-block; background: #f0fdf4; color: #166534; padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;">{{
                        p['type'] }}</span>
                </div>

                <div class="card-body" style="padding: 0;">
                    <p
                        style="margin-bottom: 1.25rem; color: #F59E0B; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 6px;">
                        <span style="font-size: 1.2rem;">⭐</span> {{ p['ratings'] }}
                    </p>

                    <div style="margin-bottom: 0.75rem; color: #475569; font-size: 0.95rem;">
                        <strong style="color: var(--text-main);">Entry Fee:</strong> ₹{{ p['Entrance Fee in INR'] }}
                    </div>
                    <div style="color: #475569; font-size: 0.95rem;">
                        <strong style="color: var(--text-main);">Time to Visit:</strong> {{ p['time needed to visit in
                        hrs'] }} hrs
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>

        <div style="text-align: center; margin-top: 5rem; padding-bottom: 5rem;">
            <a href="/" class="btn-primary" style="width: auto; padding: 1rem 3rem; border-radius: 50px;">⬅ New City
                Search</a>
        </div>
    </div>
</body>

</html>
